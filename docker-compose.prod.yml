# Production Docker Compose Override Manifest
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  db:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  app:
    restart: always
    environment:
      DEVMIND_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
